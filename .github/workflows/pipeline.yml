name: CI/CD Pipeline

# ── Trigger ────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PHP_VERSION: "8.2"

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 1 — BUILD & LINT
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  build:
    name: "Stage 1 - Build and Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate Composer configuration
        run: composer validate

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint — PHP syntax check
        run: find src api tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Lint — PSR-12 code style (src only)
        run: vendor/bin/phpcs --standard=PSR12 --warning-severity=0 src/

      - name: Upload vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor/

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 2 — UNIT + INTEGRATION TESTS
# ══════════════════════════════════════════════════════════════════════════════
  test:
    name: "Stage 2 - Unit and Integration Tests"
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_HOST:     127.0.0.1
      TEST_DB_PORT:     3306
      TEST_DB_NAME:     test_db
      TEST_DB_USER:     root
      TEST_DB_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Restore vendor binary permissions
        run: chmod -R +x vendor/bin/

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... attempt $i/30"
            sleep 2
          done

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit --testdox

      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite Integration --testdox

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 3 — SECURITY SCAN (OWASP)
# ══════════════════════════════════════════════════════════════════════════════
  security-scan:
    name: "Stage 3 - Security Scan (OWASP)"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Restore vendor binary permissions
        run: chmod -R +x vendor/bin/

      - name: Check PHP dependencies for known CVEs
        run: composer audit --format=plain || true

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: customers-app
          path: "."
          format: HTML
          out: reports
          args: "--enableExperimental"

      - name: Upload OWASP security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-security-report
          path: reports/
          if-no-files-found: ignore

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 4 — BLUE-GREEN DEPLOY TO VERCEL
# ══════════════════════════════════════════════════════════════════════════════
  deploy:
    name: "Stage 4 - Blue-Green Deploy to Vercel"
    runs-on: ubuntu-latest
    needs: [test, security-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # BLUE — deploy preview (new version, not yet live)
      - name: Deploy blue preview slot
        id: blue
        run: |
          PREVIEW_URL=$(vercel deploy \
            --yes \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --env DB_HOST=${{ secrets.DB_HOST }} \
            --env DB_PORT=${{ secrets.DB_PORT }} \
            --env DB_NAME=${{ secrets.DB_NAME }} \
            --env DB_USER=${{ secrets.DB_USER }} \
            --env DB_PASSWORD=${{ secrets.DB_PASSWORD }})
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Blue preview: $PREVIEW_URL"

      # Smoke test the preview before touching production
      - name: Smoke test blue slot
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "${{ steps.blue.outputs.preview_url }}")
          echo "Blue slot HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test FAILED — aborting promotion"
            exit 1
          fi
          echo "Smoke test PASSED"

      # GREEN — promote verified preview to production (zero-downtime)
      - name: Promote to production (green slot)
        run: |
          vercel promote "${{ steps.blue.outputs.preview_url }}" \
            --token=${{ secrets.VERCEL_TOKEN }}

      # Verify production is healthy
      - name: Verify production health
        run: |
          sleep 5
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://${{ secrets.VERCEL_DOMAIN }}")
          echo "Production HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Production health check FAILED"
            exit 1
          fi
          echo "Production is healthy"
