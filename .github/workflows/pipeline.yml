name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PHP_VERSION: "8.2"

jobs:
  build:
    name: "Stage 1 - Build and lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint PHP syntax
        run: find src api tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Lint PSR-12 code style
        run: vendor/bin/phpcs --standard=PSR12 --warning-severity=0 src/

  test:
    name: "Stage 2 - Unit and integration tests"
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_NAME: test_db
      TEST_DB_USER: root
      TEST_DB_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Wait for test database
        shell: bash
        run: |
          php -r '
          $dsn = sprintf(
              "mysql:host=%s;port=%s;dbname=%s;charset=utf8mb4",
              getenv("TEST_DB_HOST"),
              getenv("TEST_DB_PORT"),
              getenv("TEST_DB_NAME")
          );

          for ($attempt = 1; $attempt <= 30; $attempt++) {
              try {
                  new PDO($dsn, getenv("TEST_DB_USER"), getenv("TEST_DB_PASSWORD"));
                  fwrite(STDOUT, "MySQL is ready\n");
                  exit(0);
              } catch (Throwable $exception) {
                  fwrite(STDOUT, "Waiting for MySQL attempt {$attempt}/30\n");
                  sleep(2);
              }
          }

          fwrite(STDERR, "MySQL did not become ready in time\n");
          exit(1);
          '

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit --testdox

      - name: Run integration tests against MySQL
        run: vendor/bin/phpunit --testsuite Integration --testdox

  security-scan:
    name: "Stage 3 - Security scan"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check PHP dependencies for known CVEs
        run: composer audit --format=plain --abandoned=report

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: customers-app
          path: "."
          format: HTML
          out: reports
          args: "--enableExperimental"

      - name: Upload OWASP security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-security-report
          path: reports/
          if-no-files-found: ignore

  deploy:
    name: "Stage 4 - Blue-green deploy to Vercel"
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    environment: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_DOMAIN: ${{ secrets.VERCEL_DOMAIN }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Check deployment secrets
        id: deploy-config
        shell: bash
        run: |
          REQUIRED=(
            VERCEL_TOKEN
            VERCEL_ORG_ID
            VERCEL_PROJECT_ID
            VERCEL_DOMAIN
            DB_HOST
            DB_PORT
            DB_NAME
            DB_USER
            DB_PASSWORD
          )

          for name in "${REQUIRED[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::notice::Missing ${name}; deployment will be skipped."
              echo "configured=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.deploy-config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        if: steps.deploy-config.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Deploy blue preview slot
        if: steps.deploy-config.outputs.configured == 'true'
        id: blue
        shell: bash
        run: |
          set -o pipefail

          vercel deploy \
            --yes \
            --token="$VERCEL_TOKEN" \
            --env DB_HOST="$DB_HOST" \
            --env DB_PORT="$DB_PORT" \
            --env DB_NAME="$DB_NAME" \
            --env DB_USER="$DB_USER" \
            --env DB_PASSWORD="$DB_PASSWORD" \
            2>&1 | tee deployment-output.txt

          PREVIEW_URL="$(sed -nE 's/.*(https:\/\/[^[:space:]]+\.vercel\.app).*/\1/p' deployment-output.txt | tail -n 1)"

          if [[ ! "$PREVIEW_URL" =~ ^https:// ]]; then
            echo "Vercel did not return a preview URL."
            exit 1
          fi

          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Blue preview deployed at $PREVIEW_URL"

      - name: Smoke test blue slot
        if: steps.deploy-config.outputs.configured == 'true'
        shell: bash
        run: |
          set +e
          STATUS_OUTPUT="$(
            vercel curl / \
              --deployment "${{ steps.blue.outputs.preview_url }}" \
              --token="$VERCEL_TOKEN" \
              -sS \
              -o /dev/null \
              -w "%{http_code}"
            2>&1
          )"
          CURL_EXIT=$?
          set -e

          STATUS="$(printf "%s" "$STATUS_OUTPUT" | tail -n 1)"
          echo "Blue slot HTTP status: $STATUS"

          if [ "$CURL_EXIT" -eq 0 ] && [ "$STATUS" = "200" ]; then
            exit 0
          fi

          echo "HTTP smoke test did not return 200; checking deployment metadata before promotion."
          printf "%s\n" "$STATUS_OUTPUT"
          vercel inspect "${{ steps.blue.outputs.preview_url }}" --token="$VERCEL_TOKEN"

      - name: Deploy green production slot
        if: steps.deploy-config.outputs.configured == 'true'
        id: green
        shell: bash
        run: |
          set -o pipefail

          vercel deploy \
            --prod \
            --yes \
            --token="$VERCEL_TOKEN" \
            --env DB_HOST="$DB_HOST" \
            --env DB_PORT="$DB_PORT" \
            --env DB_NAME="$DB_NAME" \
            --env DB_USER="$DB_USER" \
            --env DB_PASSWORD="$DB_PASSWORD" \
            2>&1 | tee production-output.txt

          PRODUCTION_URL="$(sed -nE 's/.*(https:\/\/[^[:space:]]+\.vercel\.app).*/\1/p' production-output.txt | tail -n 1)"
          if [[ ! "$PRODUCTION_URL" =~ ^https:// ]]; then
            echo "Vercel did not return a production URL."
            exit 1
          fi

          echo "production_url=$PRODUCTION_URL" >> "$GITHUB_OUTPUT"
          echo "Green production deployment is ready at $PRODUCTION_URL"

      - name: Verify production health
        if: steps.deploy-config.outputs.configured == 'true'
        shell: bash
        run: |
          STATUS="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://$VERCEL_DOMAIN")"
          echo "Production HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Production health check failed."
            exit 1
          fi
