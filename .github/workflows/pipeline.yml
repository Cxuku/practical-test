name: CI/CD Pipeline

# ── Trigger ────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 1 — BUILD & LINT
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  build:
    name: "Stage 1 · Build & Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint — PHP syntax check
        run: find src api -name "*.php" | xargs php -l

      - name: Lint — PSR-12 code style
        run: vendor/bin/phpcs --standard=PSR12 src/ api/

      - name: Upload vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor/

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 2 — TEST (unit + integration against a real MySQL service container)
# ══════════════════════════════════════════════════════════════════════════════
  test:
    name: "Stage 2 · Unit & Integration Tests"
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DB_HOST:     127.0.0.1
      TEST_DB_PORT:     3306
      TEST_DB_NAME:     test_db
      TEST_DB_USER:     root
      TEST_DB_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit --testdox

      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite Integration --testdox

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 3 — SECURITY SCAN (OWASP dependency check + PHP advisory DB)
# ══════════════════════════════════════════════════════════════════════════════
  security-scan:
    name: "Stage 3 · Security Scan (OWASP)"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      # PHP advisory database check (fast, no Java required)
      - name: Install local-php-security-checker
        run: |
          curl -fsSL \
            https://github.com/fabpot/local-php-security-checker/releases/download/v2.0.6/local-php-security-checker_linux_amd64 \
            -o local-php-security-checker
          chmod +x local-php-security-checker

      - name: Check PHP dependencies for known CVEs
        run: ./local-php-security-checker --format=json || true

      # Full OWASP Dependency-Check (covers all dependency files)
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project:  "customers-app"
          path:     "."
          format:   "HTML"
          out:      "reports"
          args:     "--enableExperimental"

      - name: Upload OWASP security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-security-report
          path: reports/

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 4 — DEPLOY (blue-green zero-downtime via Vercel preview → promote)
# ══════════════════════════════════════════════════════════════════════════════
  deploy:
    name: "Stage 4 · Blue-Green Deploy to Vercel"
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # BLUE — deploy to a preview URL (the new version, not yet live)
      - name: Deploy preview (blue slot)
        id: blue
        run: |
          PREVIEW_URL=$(vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --env DB_HOST=${{ secrets.DB_HOST }} \
            --env DB_PORT=${{ secrets.DB_PORT }} \
            --env DB_NAME=${{ secrets.DB_NAME }} \
            --env DB_USER=${{ secrets.DB_USER }} \
            --env DB_PASSWORD=${{ secrets.DB_PASSWORD }})
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed preview: $PREVIEW_URL"

      # Smoke-test the blue slot before touching production
      - name: Smoke test blue slot
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "${{ steps.blue.outputs.preview_url }}")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test FAILED — aborting promotion"
            exit 1
          fi
          echo "Smoke test PASSED"

      # GREEN — promote the verified preview to production (atomic, zero-downtime)
      - name: Promote to production (green slot)
        run: |
          vercel promote "${{ steps.blue.outputs.preview_url }}" \
            --token=${{ secrets.VERCEL_TOKEN }}

      # Verify production is healthy after promotion
      - name: Verify production health
        run: |
          sleep 5
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://${{ secrets.VERCEL_DOMAIN }}")
          echo "Production HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Production health check FAILED"
            exit 1
          fi
          echo "Production is healthy"
